<!doctype html>
<html lang="es-CO" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect para carga rápida de fuentes y API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Tipografías oficiales: Inter (cuerpo) + Outfit (headings) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Título Principal Oficial -->
    <title>Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Meta Descripción y Palabras Clave SEO -->
    <meta
      name="description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá: cuatrimotos, parapente, glamping, avistamiento de aves y gastronomía típica local."
    />
    <meta
      name="keywords"
      content="Manaure Vive, Rifa Manaure, Sorteo Ecoturístico, Serranía del Perijá, Turismo Cesar, Cuatrimotos Manaure, Parapente Manaure, Glamping Manaure, Sorteo Lotería de Santander, Manaure Balcón del Cesar"
    />
    <meta name="author" content="Manaure Vive" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook / WhatsApp / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Manaure Vive" />
    <meta
      property="og:title"
      content="Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá"
    />
    <meta
      property="og:description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá: cuatrimotos, parapente, glamping y gastronomía local."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Gran Sorteo Ecoturístico Manaure Vive - Serranía del Perijá"
    />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá"
    />
    <meta
      name="twitter:description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Gran Sorteo Ecoturístico Manaure Vive" />

    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />

    <meta name="theme-color" content="#0a1410" />
    <meta name="msapplication-TileColor" content="#0a1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
