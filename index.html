<!doctype html>
<html lang="es-CO" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevenir retención de index.html desactualizado en caché del navegador tras nuevos despliegues -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Preconnect y DNS-Prefetch para optimizar consultas a Supabase -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- Preconnect y DNS-Prefetch para optimizar carga de imágenes en Cloudinary CDN -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Título Principal Oficial -->
    <title>Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá</title>

    <!-- Canonical URL -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Meta Descripción y Palabras Clave SEO -->
    <meta
      name="description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá: cuatrimotos, parapente, glamping, avistamiento de aves y gastronomía típica local."
    />
    <meta
      name="keywords"
      content="Manaure Vive, Rifa Manaure, Sorteo Ecoturístico, Serranía del Perijá, Turismo Cesar, Cuatrimotos Manaure, Parapente Manaure, Glamping Manaure, Sorteo Oficial Loterías de Colombia, Manaure Balcón del Cesar"
    />
    <meta name="author" content="Manaure Vive" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook / WhatsApp / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="Manaure Vive" />
    <meta
      property="og:title"
      content="Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá"
    />
    <meta
      property="og:description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá: cuatrimotos, parapente, glamping y gastronomía local."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image-v2.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-image-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vista panorámica de la Serranía del Perijá en Manaure Balcón del Cesar, Gran Sorteo Ecoturístico Manaure Vive"
    />
    <meta property="og:locale" content="es_CO" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Manaure Vive | Gran Sorteo Ecoturístico y Aventura en el Perijá"
    />
    <meta
      name="twitter:description"
      content="Participa en el Gran Sorteo Oficial de Manaure Vive. Gana experiencias ecoturísticas inolvidables en la Serranía del Perijá."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image-v2.jpg" />
    <meta name="twitter:image:alt" content="Vista panorámica de la Serranía del Perijá en Manaure Balcón del Cesar" />

    <!-- Branding Favicons y App Icons Oficiales para la Pestaña del Navegador -->
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- Tema y Color de Navegador Móvil -->
    <meta name="theme-color" content="#1B4A2E" />
    <meta name="msapplication-TileColor" content="#1B4A2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Manaure Vive" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
