<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mvGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="mvGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#0a1410" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#mvGoldGrad)" stroke-width="2" opacity="0.85" />

  <!-- Mountain Silhouettes (Serranía del Perijá) -->
